appId: com.aaryandas.appliedresearch
productName: Applied Research
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - LICENSE
asar: true
npmRebuild: false
artifactName: '${name}-${version}-${os}-${arch}.${ext}'
mac:
  category: public.app-category.education
  target: [dmg, zip]
  identity: null
win:
  target: [nsis]
linux:
  category: Education
  target: [AppImage]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
