name: Independent review (untrusted pending)

# Untrusted pull_request path. Checks out PR code only for helper tests.
# Must never pass the Cursor Admin credential into this job. Independent
# review evaluation runs in independent-review-trusted.yml from the default
# branch only.
#
# Repository settings currently mark this file's workflow id 353522718
# (Actions name Independent review (Claude)) disabled_manually to stop
# Fable. Keep that setting off until the reviewed trusted replacement is
# merged to the default branch and a human explicitly re-enables the
# appropriate workflow. This PR does not re-enable it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: independent-review-untrusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pending:
    name: Notice only
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Delivery helper tests
        run: npm run test:delivery
      - name: Refuse untrusted Cursor evaluation
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/delivery-review.mjs untrusted
