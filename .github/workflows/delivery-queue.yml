name: Delivery queue

# Untrusted pull_request jobs only print a notice and run helper tests.
# Live GitHub/Linear/main/check recheck runs on default-branch
# workflow_dispatch under concurrency group delivery-queue-live.
# Merge and deploy activation stay off. Native merge-group refs are
# rejected. Does not edit or dispatch hosted Sonar.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  untrusted-notice:
    name: Untrusted notice (not live eligibility)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: delivery-queue-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Delivery helper tests
        run: npm run test:delivery
      - name: Untrusted notice
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/delivery-queue.mjs untrusted

  trusted-evaluate:
    name: Live eligibility (activation off)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: delivery-queue-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Live exact-head recheck
        env:
          TRUSTED_DEFAULT_BRANCH: 'true'
          DELIVERY_MERGE_ACTIVATION: ${{ vars.DELIVERY_MERGE_ACTIVATION }}
          DELIVERY_DEPLOY_ACTIVATION: ${{ vars.DELIVERY_DEPLOY_ACTIVATION }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/delivery-queue.mjs evaluate
