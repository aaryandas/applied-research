name: Delivery queue

# Serialized one-candidate merge/deploy evaluation. Merge and deploy activation
# stay off until this orchestration is independently reviewed. pull_request
# events never merge. Native merge-group refs are rejected. Does not edit or
# dispatch hosted Sonar (AR-45 / cursor/enable-hosted-sonar-main-acd0).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'delivery-queue-merge' || format('delivery-queue-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  evaluate:
    name: Serialized eligibility
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Delivery helper tests
        run: node --test scripts/delivery-review.test.mjs scripts/delivery-queue.test.mjs scripts/delivery-cursor-api.test.mjs
      - name: Evaluate queue (activation off)
        env:
          DELIVERY_MERGE_ACTIVATION: ${{ vars.DELIVERY_MERGE_ACTIVATION }}
          DELIVERY_DEPLOY_ACTIVATION: ${{ vars.DELIVERY_DEPLOY_ACTIVATION }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/delivery-queue.mjs
