name: Linear gate

# Secrets and gate code come from the trusted base, never the PR checkout.
# Periodic reconciliation refreshes the exact-head status after Linear-only changes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [linear-verification-completed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

concurrency:
  group: linear-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || 'reconcile' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Reconcile Linear verification
    if: github.actor != 'dependabot[bot]' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Publish exact-head Linear gate statuses
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/linear-gate.mjs
      - name: Preserve trusted gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-receipts
          if-no-files-found: ignore
          retention-days: 14

  queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Refuse unsupported native merge queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_CONTEXT: Linear gate
        run: node scripts/merge-group-gates.mjs
