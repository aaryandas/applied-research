name: Linear gate

# Ticket lookup and lifecycle classification. Expected In Development on a
# draft PR is not a code defect; merge eligibility still requires In Review
# in the trusted queue. This job does not move Linear status.
# Same-PR concurrency reduces duplicate attachmentLinkURL work. A cancelled run is not a passing Linear gate; the newest invocation must finish classification. Serialization is not the idempotency proof.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Linear gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Ticket lookup and lifecycle classification
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/linear-gate.mjs
