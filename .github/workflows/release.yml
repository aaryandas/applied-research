name: One-time approved macOS deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-deploy-ace6f72-20260909
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Enforce the single deployment date
        run: test "$(date -u +%Y-%m-%d)" = '2026-09-09'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ace6f724945f0e0213fc425c2bc7ac291344c347
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the approved ARM64 desktop revision
        run: npx --no-install electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record revision and checksums
        run: |
          git rev-parse HEAD > dist/REVISION.txt
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applied-research-macos-arm64-ace6f72
          path: |
            dist/*.dmg
            dist/*.zip
            dist/REVISION.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
