name: Desktop smoke feedback

# Independent early feedback while the full CI gate runs. This job does not
# replace any formatting, type, coverage, build, or packaged check in verify.yml.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron*'
      - 'playwright.config.ts'
      - '.github/workflows/desktop-smoke-feedback.yml'

permissions:
  contents: read

concurrency:
  group: desktop-smoke-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  desktop:
    name: macOS desktop and packaged smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Desktop smoke
        run: npm run test:e2e
      - name: Package candidate
        run: npx --no-install electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged smoke
        run: npm run test:packaged
      - name: Save desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: early-desktop-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
