name: Hosted Sonar queue

# Community Build has one main analysis per project. Scan candidates serially,
# then persist the server analysis identity as an exact-head GitHub status.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional source PR number to retry explicitly
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

# Scheduled selection drains missed/coalesced events from the durable PR inventory.
concurrency:
  group: sonar-community-project
  cancel-in-progress: false

jobs:
  analyze:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Select one CI-passed current source revision
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr_number }}
        run: node scripts/hosted-sonar.mjs select
      - name: Read frozen candidate without executing its code
        if: steps.pick.outputs.sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage from that revision's successful secretless CI
        if: steps.pick.outputs.sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: ${{ runner.temp }}/sonar-untrusted-coverage
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare fixed scanner configuration
        if: steps.pick.outputs.sha != ''
        env:
          CANDIDATE_PATH: ${{ github.workspace }}/candidate
          COVERAGE_PATH: ${{ runner.temp }}/sonar-untrusted-coverage
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: node scripts/hosted-sonar.mjs prepare
      - name: Analyze on hosted Sonar and wait for server quality gate
        if: steps.pick.outputs.sha != ''
        id: scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: candidate
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=${{ steps.pick.outputs.sha }}
            -Dsonar.scm.revision=${{ steps.pick.outputs.sha }}
            -Dsonar.typescript.tsconfigPaths=.sonar-tsconfig.json
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Bind server result and diff findings to exact PR head
        if: always() && steps.pick.outputs.sha != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCAN_SHA: ${{ steps.pick.outputs.sha }}
          SCAN_PR: ${{ steps.pick.outputs.number }}
          SCAN_ATTEMPT: ${{ steps.pick.outputs.attempt }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          CANDIDATE_PATH: ${{ github.workspace }}/candidate
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/hosted-sonar.mjs finish
      - name: Preserve hosted analysis receipt
        if: always() && steps.pick.outputs.sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-${{ steps.pick.outputs.sha }}
          path: ${{ runner.temp }}/sonar-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Preserve trusted gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-receipts
          if-no-files-found: ignore
          retention-days: 14
