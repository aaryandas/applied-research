name: Sonar (main only)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    if: github.ref == 'refs/heads/main' && vars.SONAR_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarqube-production-6550.up.railway.app' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'applied-research-hosted' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'Missing SONAR_HOST_URL'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo 'Missing SONAR_PROJECT_KEY'; exit 1; }
          test -n "$SONAR_TOKEN" || {
            echo 'Missing SONAR_TOKEN secret'
            echo 'Add a SonarQube project analysis token as repository secret SONAR_TOKEN.'
            echo 'Host: '"$SONAR_HOST_URL"'  Project: '"$SONAR_PROJECT_KEY"
            exit 1
          }

  checks:
    needs: configuration
    uses: ./.github/workflows/verify.yml

  analyze:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: coverage
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarqube-production-6550.up.railway.app' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'applied-research-hosted' }}
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.typescript.tsconfigPaths=tsconfig.node.json,tsconfig.web.json
            -Dsonar.qualitygate.wait=true
