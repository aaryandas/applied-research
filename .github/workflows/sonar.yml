name: Sonar (main only)

# Main-only consumer of an authenticated successful CI coverage artifact.
# GitHub workflow_run SHA is the default-branch tip at event time, not the
# source CI SHA. Scan only when source CI SHA = this run SHA = live main.
# If main advanced, fail closed; a newer CI run supplies the next analysis.
# Do not post a custom success status. PR CI never receives Sonar secrets.

on:
  workflow_run:
    workflows:
      - CI
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'Missing SONAR_HOST_URL variable'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo 'Missing SONAR_PROJECT_KEY variable'; exit 1; }

  provenance:
    name: Provenance
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      analyzed_sha: ${{ steps.authenticate.outputs.analyzed_sha }}
      source_run_id: ${{ steps.authenticate.outputs.source_run_id }}
      source_run_attempt: ${{ steps.authenticate.outputs.source_run_attempt }}
      artifact_id: ${{ steps.authenticate.outputs.artifact_id }}
      coverage_sha256: ${{ steps.authenticate.outputs.coverage_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Authenticate current-main CI coverage
        id: authenticate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONSUMER_SHA: ${{ github.sha }}
          CONSUMER_REF: ${{ github.ref }}
          CONSUMER_EVENT: ${{ github.event_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/hosted-sonar.mjs authenticate
      - name: Upload hosted Sonar provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-sonar-provenance-${{ steps.authenticate.outputs.analyzed_sha }}
          path: hosted-sonar-provenance.json
          if-no-files-found: error
          retention-days: 7

  analyze:
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Re-authenticate before secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONSUMER_SHA: ${{ github.sha }}
          CONSUMER_REF: ${{ github.ref }}
          CONSUMER_EVENT: ${{ github.event_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/hosted-sonar.mjs authenticate
      - name: Download authenticated CI coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.provenance.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.provenance.outputs.source_run_id }}
          path: ${{ runner.temp }}/ci-coverage
      - name: Verify coverage is lcov data
        env:
          COVERAGE_DOWNLOAD_DIR: ${{ runner.temp }}/ci-coverage
          COVERAGE_DEST: coverage/lcov.info
        run: node scripts/hosted-sonar.mjs verify-coverage
      - name: Install scanner analysis dependencies
        run: npm ci
      - name: Require analysis token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo 'Missing SONAR_TOKEN secret'; exit 1; }
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.typescript.tsconfigPaths=tsconfig.node.json,tsconfig.web.json
            -Dsonar.qualitygate.wait=true
