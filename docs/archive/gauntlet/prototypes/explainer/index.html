:root{color-scheme:dark;--ground:#0C0F12;--surface:#14181C;--hairline:#22272C;--ink:#ECEAE4;--muted:#A9A6A0;--human:#EFE6CF;--rule:#FBD094;--cold:#7BC7C9;--passage:rgba(251,208,148,.13)}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 'Familjen Grotesk',sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{border:0;background:none;color:var(--muted);padding:7px 10px;border-radius:5px;cursor:pointer}button:hover,a:hover{color:var(--cold);background:var(--surface)}button:active{transform:translateY(1px)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cold);outline-offset:3px}a{color:inherit;text-underline-offset:4px}::selection{background:var(--passage);color:var(--human)}input{color:var(--human);caret-color:var(--rule);background:var(--ground);border:1px solid var(--hairline);border-radius:5px;padding:10px;min-width:0}input::placeholder{color:var(--muted);opacity:1}select{background:var(--surface);color:var(--ink);border:1px solid var(--hairline);padding:5px;border-radius:4px}svg.icon{width:16px;height:16px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}p{margin:0 0 18px}h1,h2,h3{font-weight:400;margin:0}small,.meta{color:var(--muted);font-size:12px}.coord{font:11px/1.6 'Martian Mono',monospace;color:var(--muted)}.toolbar{height:58px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--hairline)}.brand{font:20px 'Newsreader',serif;margin-right:12px}.toolbar button[aria-pressed="true"]{color:var(--ink);border-bottom:1px solid var(--ink);border-radius:0}.spacer{flex:1}.lab{min-height:43px;display:flex;align-items:center;gap:10px;padding:6px 24px;background:var(--surface);border-bottom:1px solid var(--hairline);font-size:12px}.lab strong{font-weight:500}.lab label{display:flex;gap:7px;align-items:center}.shell{display:grid;grid-template-columns:minmax(0,1fr) 284px;height:calc(100vh - 101px)}.reader-scroll{overflow:auto;scrollbar-color:var(--ha .proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);

  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),

  font-size: 13px;

  -webkit-font-smoothing: antialiased;

  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {

}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {

  outline-offset: 2px;
}

.proto-picker-item[data-active] {

}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

function passage(){return `<div class="passage reader-origin" id="origin" tabindex="-1"><div class="selection-tools"><button onclick="notify('Explain opens a text question in the full Reader. This study focuses on Explain visually.')">Explain</button><button onclick="notify('Notes are human writing. This study focuses on Explain visually.')">Note</button><button onclick="notify('Insights are human writing. This study focuses on Explain visually.')">Insight</button><button class="primary" onclick="requestExplainer()">Explain visually <small>x</small></button></div>${current===0&&!offerDismissed.has(0)&&!everRequested?`<button class="offer" aria-label="Explain visually (x on a selection)" title="Explain visually · x on a selection" onclick="requestExplainer()">${icon('film')}</button><button class="offer-dismiss" aria-label="Dismiss visual explanation offer" title="Dismiss offer" onclick="dismissOffer()">${icon('close')}</button>`:''}<p>We call our particular attention “Scaled Dot-Product Attention”. <span class="sentences" data-sentence="4">The input consists of queries and keys of dimension <i>d<sub>k</sub></i>, and values of dimension <i>d<sub>v</sub></i>.</span> <span class="sentences" data-sentence="5">We compute the dot products of the query with all keys, divide each by √<i>d<sub>k</sub></i>, and apply a softmax function to obtain the weights on the values.</span></p><p><span class="sentences" data-sentence="6">In practice, we compute the attention function on a set of queries simultaneously, packed together into a matrix <i>Q</i>.</span> <span class="sentences" data-sentence="7">The keys and values are also packed together into matrices <i>K</i> and <i>V</i>.</span></p></div>`}

function reader(){return `<div class="shell"><div class="reader-scroll"><article class="paper ${selected?'selected':''}"><p class="locator coord">Attention is all you need · §3.2</p><h1>3.2 Attention</h1><h2>Scaled Dot-Product Attention</h2>${passage()}<div id="card-slot">${card()}</div><p>We compute the matrix of outputs as:</p><div class="equation"><math display="block"><mrow><mi>Attention</mi><mo>(</mo><mi>Q</mi><mo>,</mo><mi>K</mi><mo>,</mo><mi>V</mi><mo>)</mo><mo>=</mo><mi>softmax</mi><mo>(</mo><mfrac><mrow><mi>Q</mi><msup><mi>K</mi><mi>T</mi></msup></mrow><msqrt><msub><mi>d</mi><mi>k</mi></msub></msqrt></mfrac><mo>)</mo><mi>V</mi></mrow></math></div><p>The two most commonly used attention functions are additive attention, and dot-product (multiplicative) attention. While the two are similar in theoretical complexity, dot-product attention is much faster and more space-efficient in practice, since it can be implemented using highly optimized matrix multiplication code.</p><h2 id="multi-head">Multi-Head Attention</h2><p class="small-note">End of the supplied excerpt in this prototype. <a href="https://arxiv.org/html/1706.03762v7#S3.SS2.SSS2" target="_blank" rel="noopener">Continue in the original paper.</a></p></article></div>${details()}</div>`}

// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');

const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
