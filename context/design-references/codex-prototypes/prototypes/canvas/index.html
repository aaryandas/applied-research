:root{color-scheme:dark;--ground:#0c0f12;--surface:#14181c;--line:#30353a;--ink:#eceae4;--muted:#a9a6a0;--warm:#fbd094;--human:#efe6cf;--cold:#7bc7c9;--human-bg:#1d1b18;--raised:#24201b;--chrome:#101316;--shadow:0 16px 40px #0006}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 'Familjen Grotesk',sans-serif;overflow:hidden}body.light{color-scheme:light;--ground:#fbfaf7;--surface:#f3f1ec;--line:#ccc8bf;--ink:#1c1b18;--muted:#5a574f;--warm:#a8742a;--human:#1c1b18;--cold:#005a5d;--human-bg:#f8f3e8;--raised:#f6ebd6;--chrome:#efece5;--shadow:0 16px 40px #29231c20}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;border-radius:6px;padding:8px 10px}button:hover{background:var(--surface);color:var(--cold)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cold);outline-offset:4px}::selection{background:#aa793866;color:var(--ink)}input,textarea{caret-color:var(--warm)}*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}svg.icon{width:17px;height:17px;fill:currentColor;vertical-align:-3px;flex-shrink:0}button svg{pointer-events:none}.with-icon{display:inline-flex;align-items:center;gap:7px}.muted{color:var(--muted)}.serif{font-family:'Newsreader',Georgia,serif}.small{font-size:12px}.primary{background:var(--ink);color:var(--ground);border-radius:999px;padding:9px 15px}.primary:hover{background:var(--cold);color:var(--ground)}.outline{border:1px solid var(--line)}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:20px;background:var(--chrome)}.brand{font:22px 'Newsreader',serif;white-space:nowrap}.project{display:flex;align-items:center;gap:12px}.project .divider{height:20px;border-left:1px solid var(--line)}.header-actions{display:flex;gap:8px;align-items:center}.header-actions .small{margin-right:10px}
